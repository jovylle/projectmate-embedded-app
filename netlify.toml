# Netlify: marketing homepage + live demo + embed.js + overlay app (`pnpm run build:site` → site/out).
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "pnpm install --frozen-lockfile && pnpm run build:site"
  publish = "site/out"

[build.environment]
  NODE_VERSION = "20"
